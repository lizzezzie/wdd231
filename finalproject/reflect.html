<body>

<header>
    <a href="index.html" class="brand" aria-label="Home">
        <img src="images/logo.svg" alt="" class="logo">
        <span class="brand-name">Personal Growth Explorer</span>
    </a>



    <nav>
        <button id="menu-btn" aria-label="Open navigation menu">☰</button>

            <li><a href="index.html">Home</a></li>

            <li><a href="reflect.html" class="active">Reflect</a></li>
        </ul>
    </nav>
</header>

<main>

    <section class="form-section">
        <h2>Personal Reflection</h2>
        <p>Take a moment to reflect on where you are and what you need.</p>

        <form action="thankyou.html" method="get">

            <!-- Name -->
            <label for="name">
                Your Name
                <input type="text" id="name" name="name" required>
            </label>

            <!-- Email -->
            <label for="email">
                Email
                <input type="email" id="email" name="email" required>
            </label>

            <!-- Category -->
            <label for="focus">
                What area do you want to focus on?
                <select id="focus" name="focus" required>
                    <option value="">Select an option</option>
                    <option value="emotional">Emotional Wellbeing</option>
                    <option value="growth">Personal Growth</option>
                    <option value="health">Physical Health</option>
                </select>
            </label>

            <!-- Reflection -->
            <label for="reflection">
                What are you currently struggling with?
                <textarea id="reflection" name="reflection" rows="4" required></textarea>
            </label>

            <!-- Goal -->
            <label for="goal">
                What is one small step you can take?
                <textarea id="goal" name="goal" rows="3" required></textarea>
            </label>

            <!-- Submit -->
            <button type="submit">Reflect</button>

        </form>
    </section>

</main>
